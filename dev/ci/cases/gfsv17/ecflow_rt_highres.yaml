{% set runtests = '/lfs/h2/emc/stmp/' ~ ('USER' | getenv) ~ '/RUNTESTS' %}
# Shared defaults for dev/ush/gfsv17_ecflow_rt_setup_expt.sh. Do not edit this file for your own
# experiment: override a value with the command line options or "--set SECTION.KEY=VALUE" of the
# script, or export it as ECFRT_<SECTION>_<KEY> (all of them are loaded by
# "source dev/ush/gfsv17_ecflow_rt_env.sh").
experiment:
  net: gfs
  mode: cycled
  pslot: rt17_ecflow_highres
  app: S2SW
  resdetatmos: 1152
  resensatmos: 384
  resdetocean: 0.25
  nens: 80
  interval: 6
  start: warm
  comroot: {{ runtests }}/COMROOT
  expdir: {{ runtests }}/EXPDIR
  edate: 2027011600
  icsdir: /lfs/h2/emc/gfstemp/emc.global/comroot/rt17_upd03_realtime
  yaml: {{ HOMEglobal }}/dev/ci/cases/gfsv17/s2sw_realtime.yaml

ecflow:
  suite: gfs_v17_nco
  dataroot: {{ runtests }}/RUNDIR
  outputdir: {{ runtests }}/OUTPUT
  # ecflow writes the job files (.job1) under ecf_home and the job output under ecf_out
  ecf_home: {{ runtests }}/ECF_HOME
  ecf_out: {{ runtests }}/ECF_OUT
  ncycles: 1
  # realtime comroot whose gdas/enkfgdas data start the first cycle
  src_comroot: /lfs/h2/emc/gfstemp/emc.global/comroot/retrov17_01_realtime
  # host and port are user-specific: do not set them here. Instead export ECFRT_ECFLOW_HOST and
  # ECFRT_ECFLOW_PORT (or use --ecf-host/--ecf-port, or ECF_HOST/ECF_PORT), which all take priority
  # over this file. Without them the host follows the login node and the port is found from your
  # running server.
